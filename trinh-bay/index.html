<title>Bộ lọc Laptop: Hiện tại và Phương án 2 cấp</title>
<style>
:root { --ink:#101828; --mut:#667085; --line:#e4e7ec; --bg:#eef0f3; --card:#fff; --tim:#6d28d9;
  --gop:#f59e0b; --gop-bg:#fff3e0; --moi:#12b76a; --moi-bg:#ecfdf3; --an:#c4c8cf; --an-bg:#f2f4f7; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; }   /* màn hình thấp: trang cuộn dọc, bảng lọc không bị bóp */
.top { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line); }
.top h1 { font-size: 18px; margin: 0 6px 0 0; white-space: nowrap; }
.sp { flex: 1; }
.tog { display: flex; gap: 6px; flex-wrap: wrap; }
.tg { font: 600 13.5px Inter, system-ui, sans-serif; border: 1px solid #d0d5dd; background: #fff; color: #98a2b3; border-radius: 999px; padding: 5px 12px 5px 9px; cursor: pointer; white-space: nowrap; }
.tg::before { content: ""; display: inline-block; width: 13px; height: 13px; border-radius: 4px; border: 1.5px solid #d0d5dd; margin-right: 7px; vertical-align: -2px; }
.tg[aria-pressed="true"] { color: var(--ink); border-color: #b9a5f0; background: #f6f2ff; }
.tg[aria-pressed="true"]::before { background: var(--tim); border-color: var(--tim); box-shadow: inset 0 0 0 2px #fff; }
.btn { font: 600 14px Inter, system-ui, sans-serif; border: 1px solid #d0d5dd; background: #fff; color: var(--ink); border-radius: 8px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: #f9fafb; } .btn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.chinh { background: var(--tim); border-color: var(--tim); color: #fff; } .btn.chinh:hover { background: #5b21b6; }
.sub { display: flex; gap: 4px 16px; flex-wrap: wrap; align-items: center; padding: 8px 18px 0; font-size: 12.5px; color: #475467; }
.sw { display: inline-block; width: 22px; height: 14px; border-radius: 4px; border: 1.5px solid #d0d5dd; background: #fff; vertical-align: -2px; margin-right: 5px; }
.sw.gop { background: var(--gop-bg); border-color: var(--gop); } .sw.moi { background: var(--moi-bg); border-color: var(--moi); }
.sw.an { background: var(--an-bg); border-color: var(--an); border-style: dashed; }
.so { display: inline-block; font: 700 11px/1 Inter, system-ui, sans-serif; padding: 2px 6px; border-radius: 999px; border: 1px solid #d0d5dd; color: #475467; background: #fff; margin-right: 5px; vertical-align: 1px; }
.so.it { color: #b45309; border-color: var(--gop); }
.hint { color: var(--mut); }
.cols { flex: 1 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: auto minmax(460px, 1fr); gap: 0 8px; padding: 8px; }
.col { display: grid; grid-row: span 2; grid-template-rows: subgrid; min-width: 0; min-height: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }   /* subgrid: phần đầu 4 cột cao bằng nhau, bảng lọc bắt đầu ngang hàng */
.col.tat { display: none; }
.head { padding: 7px 10px 7px 14px; border-bottom: 1px solid var(--line); }
.h1r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.ten { display: flex; align-items: baseline; gap: 0 10px; flex-wrap: wrap; }
.head h2 { margin: 0; font-size: 17px; white-space: nowrap; }
.mota { font-size: 13.5px; color: #344054; font-weight: 600; }
.head .b-full { padding: 3px 10px; font-size: 12.5px; }
.h2r { display: flex; align-items: baseline; gap: 2px 14px; flex-wrap: wrap; margin-top: 2px; }
.stat { white-space: nowrap; font-size: 13px; color: var(--mut); }
.stat b { font-size: 17px; color: var(--ink); margin-right: 4px; }
.how { font-size: 12.5px; color: #344054; white-space: nowrap; }
.how::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #12b76a; margin-right: 6px; vertical-align: 1px; }
.col[data-ban="pa3"] .how::before { background: #f79009; }
.frame { position: relative; min-height: 0; overflow: hidden; background: #fff; }
.frame iframe { position: absolute; left: 0; top: 0; border: 0; width: 1200px; transform-origin: 0 0; background: #fff; }
body.full .cols { grid-template-columns: 1fr !important; }
body.full .col:not(.big) { display: none; }
.drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 82vh; overflow: auto; background: #fff; border-top: 1px solid var(--line);
  box-shadow: 0 -10px 30px rgba(16,24,40,.18); transform: translateY(105%); transition: transform .2s ease; padding: 16px 20px 22px; }
.drawer.open { transform: none; }
.dh { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.drawer h3 { margin: 0; font-size: 19px; }
.pill { display: inline-block; background: #f4ebff; color: #53389e; font-weight: 600; border-radius: 999px; padding: 4px 12px; font-size: 14px; }
/* Dải công thức ở đầu trang: vì sao gộp, công thức, mốc của Laptop, rule. Đây là phần cần đọc trước khi nhìn 4 cột. */
.ct { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding: 8px 8px 0; }
.ct-b { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px 10px; min-width: 0; }
.ct-b.chinh { border-color: #cdbdf7; background: #faf8ff; }
.ct-n { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--mut); margin-bottom: 5px; }
.ct-l { font-size: 16px; font-weight: 700; line-height: 1.5; }
.ct-l.to { font-size: 24px; line-height: 1.15; } .ct-l.to small { font-size: 14px; font-weight: 600; color: #344054; margin-left: 4px; }
.ct-s { font-size: 13.5px; color: #344054; margin-top: 3px; }
.o { display: inline-block; background: #f4ebff; color: #53389e; border-radius: 6px; padding: 0 7px; white-space: nowrap; }
.pt { color: var(--mut); font-weight: 500; margin: 0 2px; }
.thanh { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; margin-top: 5px; }
.thanh .tn { color: var(--mut); }
.thanh .tv { display: block; height: 12px; border-radius: 6px; background: #f2f4f7; overflow: hidden; }
.thanh .tv b { display: block; height: 100%; min-width: 4px; border-radius: 6px; background: var(--gop); }
.thanh .tv b.lt { background: var(--tim); }
.thanh .ts b { font-size: 16px; }
.ct ul { margin: 0; padding-left: 17px; font-size: 14px; line-height: 1.5; }
.lk { font: 600 13px Inter, system-ui, sans-serif; color: var(--tim); background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
.lk:hover { text-decoration: underline; }
body.an-luat .ct, body.an-luat .the, body.an-luat .moc-lg, body.an-luat #d-thu .pill, body.an-luat #d-thu .keo { display: none; }
body.qt #b-luat, body.qt .ct, body.qt #d-thu .pill { display: none !important; } body.qt #d-thu .keo { display: flex !important; } body.qt .the { display: inline-block !important; }
/* Đầu cột: tên, số, 1 thẻ cho biết cột có áp dụng công thức không. Cách gộp chi tiết chỉ hiện khi bấm nút "Xem cách gộp" ở dòng chú giải. */
.cg { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; margin-top: 6px; }
.the { font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.the.co { background: #f4ebff; color: #53389e; } .the.khong { background: #fff3e0; color: #b45309; } .the.chua { background: #f2f4f7; color: #475467; }
.lc { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); font-size: 13.5px; line-height: 1.38; }
.lc-t { font-weight: 700; color: #53389e; }
.col[data-ban="hien-tai"] .lc-t { color: #475467; }
.lc ul { margin: 3px 0 0; padding-left: 17px; }
.lc li { margin: 2px 0; }
.lc .vd { color: var(--mut); font-size: 12.5px; }
.lc-l { margin-top: 4px; font-size: 12.5px; color: #b54708; }
.lc-l::before { content: "Lưu ý: "; font-weight: 700; }
body:not(.mo-ct) .lc { display: none; }
/* Bảng "Cách tính" kéo lên từ đáy */
.ctg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1fr); gap: 10px; }
.ctg ol, .ctg ul { margin: 6px 0 0; padding-left: 20px; font-size: 14.5px; line-height: 1.6; }
.ctg table { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 6px; }
.ctg th { text-align: right; font-weight: 600; color: var(--mut); font-size: 12.5px; padding: 4px 8px; border-bottom: 1px solid var(--line); }
.ctg td { text-align: right; padding: 6px 8px; border-bottom: 1px solid #f2f4f7; font-variant-numeric: tabular-nums; }
.ctg th:first-child, .ctg td:first-child { text-align: left; }
.ctg td.g { font-weight: 800; }
.ctg .kq { font-size: 12.5px; padding: 2px 10px; }
.ctg .cthuc { font-size: 15.5px; font-weight: 700; line-height: 1.7; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card h4 { margin: 0; font-size: 16px; }
.card .mt { font-size: 13.5px; color: #344054; font-weight: 600; margin-bottom: 6px; }
.vds { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.vd-b { font: 600 13.5px Inter, system-ui, sans-serif; border: 1px solid #d0d5dd; background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.vd-b small { font-weight: 500; color: var(--mut); margin-left: 6px; }
.vd-b.on { border-color: var(--tim); background: #f6f2ff; }
.keo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.keo label { font-weight: 600; }
.keo input[type=range] { flex: 1; min-width: 200px; max-width: 520px; accent-color: var(--tim); }
.keo output { font-size: 22px; font-weight: 800; min-width: 70px; }
.kq { font-weight: 700; border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.kq.du { background: var(--moi-bg); color: #067647; } .kq.chua { background: var(--gop-bg); color: #b45309; }
.card .c { font-size: 17px; font-weight: 700; margin-top: 4px; }
.card .t { font-size: 13.5px; color: #344054; white-space: pre-line; margin-top: 2px; }
.card .tag { display: inline-block; margin-top: 8px; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: #f2f4f7; color: #475467; }
.card .tag.them { background: #fef3f2; color: #b42318; }
.qt-form { display: flex; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 12px; }
.qt-form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: #344054; }
.qt-form input, .qt-form select { font: 500 14px Inter, system-ui, sans-serif; border: 1px solid #d0d5dd; border-radius: 8px; padding: 7px 10px; min-width: 120px; background: #fff; color: var(--ink); }
.qt-form #qt-ten { min-width: 200px; } .qt-form input[type=number] { width: 120px; min-width: 0; }
.qt-ct { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 20px; margin-top: 12px; font-size: 13.5px; color: #344054; }
.qt-ct h4 { margin: 0 0 6px; font-size: 15px; color: var(--ink); } .qt-ct ol, .qt-ct ul { margin: 0; padding-left: 18px; } .qt-ct li { margin: 3px 0; } .qt-ct p { margin: 0; }
.qt-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; } .qt-row b { margin-right: 4px; }
.qt-chip { border: 1px solid #abefc6; background: var(--moi-bg); border-radius: 8px; padding: 3px 8px; font-weight: 600; }
.qt-row.khac .qt-chip { border-color: #fedf89; background: var(--gop-bg); }
.qt-chip small { display: block; font-weight: 500; color: var(--mut); font-size: 11.5px; }
.qt-chip.moi { outline: 2px solid var(--tim); }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
@media (max-width: 1250px) { .ct { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ctg { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  body { overflow: auto; height: auto; } html { height: auto; }
  .cols { grid-template-columns: 1fr !important; grid-template-rows: none; gap: 8px; } .col { height: 86vh; grid-row: auto; grid-template-rows: auto minmax(0, 1fr); }
  .cards, .ct, .ctg, .qt-ct { grid-template-columns: 1fr; }
  .hint { display: none; }
}
</style></head>

const frames = $$('.col iframe');
let notesOn = true;
const send = (f, m) => f.contentWindow && f.contentWindow.postMessage(Object.assign({ tb: 1 }, m), '*');
const rong = new Map();                               // bề ngang mỗi cột cần hiện: tới mép phải bảng Lọc (cột tự báo)
const popw = new Map();                               // bề ngang bảng Lọc đã báo cho từng cột
function layout() {                                   // phóng phần bảng Lọc cho vừa bề ngang cột; phần lưới máy bên phải bị cắt
  const full = document.body.classList.contains('full');
  for (const f of frames) {
    const box = f.parentElement, w = box.clientWidth, h = box.clientHeight;
    if (!w) continue;
    // cột hẹp thì bảng Lọc hẹp theo, để chữ không bị thu quá nhỏ
    const pw = Math.round(Math.min(720, Math.max(440, w / 0.85 - 40)) / 20) * 20;
    if (popw.get(f) !== pw) { popw.set(f, pw); send(f, { type: 'pop', w: pw }); }
    const W0 = rong.get(f) || pw + 40;
    const s = Math.min(w / W0, full ? 1.6 : 1.3);      // chỉ còn 1 cột thì không phóng quá to, đặt bảng Lọc vào giữa
    f.style.width = W0 + 'px';                         // khung chỉ rộng tới mép bảng Lọc, không lộ lưới máy phía sau
    f.style.left = Math.max(0, (w - W0 * s) / 2) + 'px';
    f.style.transform = `scale(${s})`;
    f.style.height = Math.ceil(h / s) + 'px';
    send(f, { type: 'k', k: Math.min(2.6, Math.max(1, 1 / s)).toFixed(3) });
  }
}
addEventListener('resize', layout);
addEventListener('message', e => {
  const m = e.data; if (!m || !m.tb) return;
  const src = frames.find(f => f.contentWindow === e.source); if (!src) return;

    const b = CFG.ban.find(x => x.id === m.ban), col = $(`.col[data-ban="${m.ban}"]`);
    if (b && b.oc && col) { const v = m.bat ? b.oc : b; col.querySelector('[data-dem="dau"]').textContent = v.dau; col.querySelector('[data-dem="khung"]').textContent = v.khung; }
    return;
  }
  if (m.type === 'san-sang') { popw.delete(src); layout(); send(src, { type: 'ghi-chu', on: notesOn }); send(src, { type: 'moc', on: !document.body.classList.contains('an-luat') }); return; }
  if (['chon', 'nhom', 'bo'].includes(m.type)) frames.forEach(f => send(f, m));
  else if (m.type === 'rong' && rong.get(src) !== m.w) { rong.set(src, m.w); layout(); }
});

let vd = CFG.thu_order[0], luot = vd.luot;
function ketQua(v, n) {
  const them = { c: 'Có giá trị riêng', t: `Bộ lọc ${v.bo_loc} dài thêm`, them: 1 }, r = {};
  if (n >= CFG.moc) r.pa1 = r.pa2 = them;
  else if (v.kieu === 'so-do') r.pa1 = r.pa2 = { c: v.pa1_gop ? `Gộp vào ${v.pa1_gop}` : 'Gộp với mức kề ít lượt tìm hơn' };
  else if (v.kieu === 'moi') {
    r.pa1 = { c: 'Có 1 giá trị mang tên dòng mới', t: 'Giá trị cùng dòng ra sau thì vào chung, không thêm nữa', them: 1 };
    r.pa2 = { c: `Vào ${v.bo_loc} khác` };
  } else {
    r.pa1 = { c: v.pa1_gop ? `Vào chung ${v.pa1_gop}` : 'Gộp với giá trị cùng dòng' };
    r.pa2 = { c: `Vào ${v.pa2_gop || v.bo_loc + ' khác'}` };
  }
  if (v.qt) {                                          // bản theo quy trình mới: so với mốc của chỗ giá trị rơi vào
    const q = v.qt, sp = q.sp == null || q.sp >= 3, top = q.top3 != null && n > q.top3;
    const du = sp && (q.het || n >= q.moc || top);
    const ly = q.het ? 'Chỗ này từ 5 giá trị trở xuống nên hiện hết' : n >= q.moc ? `Đạt mốc chung ${so(q.moc)} lượt` : `Chưa đạt mốc chung nhưng nằm trong 3 giá trị nhiều lượt tìm nhất (cần trên ${so(q.top3)} lượt)`;
    r.pa3 = du ? { c: `Hiện riêng ở ${q.cho}`, t: ly + (q.sp != null ? `, ${q.sp} máy` : ''), them: 1, dau: q.dau ? 'Màn hình đầu ' : 'Trong khung ' }
      : { c: `Vào ${q.khac}`, t: (q.sp != null && q.sp < 3 ? `Chỉ ${q.sp} máy (dưới 3)` : `Chưa đạt mốc chung ${so(q.moc)} lượt`) +
            '. Ngành hàng vẫn muốn hiện thì hiện thử 1 tháng, dưới 300 lượt truy cập thì bỏ hoặc gộp', dau: q.dau ? 'Màn hình đầu ' : 'Trong khung ' };
  } else r.pa3 = { c: v.pa3, t: 'Không cần xét lượt tìm', them: v.pa3_them, dau: 'Màn hình đầu ' };
  r['hien-tai'] = { c: 'Có giá trị riêng', t: 'Order giá trị nào thì tạo giá trị đó', them: 1, dau: 'Màn hình đầu ' };
  return r;
}
function veThu() {
  $('#vds').innerHTML = CFG.thu_order.map((v, i) => `<button class="vd-b${v === vd ? ' on' : ''}" data-i="${i}">${esc(v.ten)}${v.luot ? `<small>${so(v.luot)} lượt</small>` : ''}</button>`).join('');
  $('#luot').value = Math.min(luot, 1000);
  $('#luot-so').textContent = so(luot);
  const moc = vd.qt ? vd.qt.moc : CFG.moc, du = luot >= moc, kq = $('#luot-kq');
  kq.textContent = (du ? `Đủ mốc ${so(moc)} lượt tìm` : `Chưa đủ mốc ${so(moc)} lượt tìm`) + (vd.qt ? ' (mốc chung)' : ''); kq.className = 'kq ' + (du ? 'du' : 'chua');
  const r = ketQua(vd, luot);
  $('#thu-kq').innerHTML = CFG.ban.filter(b => r[b.id]).map(b => `<div class="card"><h4>${esc(b.ten)}</h4><div class="mt">${esc(b.mo_ta)}</div>
    <div class="c">${esc(r[b.id].c)}</div><div class="t">${esc(r[b.id].t || '')}</div>
    <span class="tag${r[b.id].them ? ' them' : ''}">${esc((r[b.id].dau || '') + (r[b.id].them ? 'thêm 1 giá trị' : 'không thêm giá trị')).replace(/^./, c => c.toUpperCase())}</span></div>`).join('');
}
$('#vds').addEventListener('click', e => { const b = e.target.closest('.vd-b'); if (!b) return; vd = CFG.thu_order[+b.dataset.i]; luot = vd.luot; veThu(); });
$('#luot').addEventListener('input', e => { luot = +e.target.value; veThu(); });
/* Thử order tự điền cho trang so sánh (bản theo tab Quy_Trình). build-trinh-bay-3-ban.py chèn file này vào trang.
 * Người xem gõ tên giá trị, chọn thuộc tính, chỗ nằm (màn hình đầu hay khung ▾), lượt tìm, số máy.
 * Trang tính lại đúng luật: mốc chung = tổng lượt tìm cả bộ lọc ÷ tổng số giá trị ÷ 10, làm tròn xuống (cộng cả giá trị vừa gõ);
 * dưới 3 máy vào Khác; chỗ có từ 5 giá trị trở xuống thì hiện hết; nhiều hơn thì hiện giá trị đạt mốc,
 * chưa đủ 3 giá trị đạt mốc thì lấy 3 giá trị nhiều lượt tìm nhất; Khác chỉ lập khi có từ 2 giá trị.
 * Gõ trùng tên 1 giá trị đang có ở đúng chỗ đó thì thay số của giá trị đó (thử "nếu giá trị này có số khác").
 * Dùng CFG.qt (dữ liệu từng chỗ) và các hàm $, $$, esc, so của trang ngoài. */
function initQT() {
  const Q = CFG.qt, CHO = {};
  const TEN_PA3 = (CFG.ban.find(b => b.id === 'pa3') || {}).ten || 'Phương án 2 cấp';
  Q.bo_loc.forEach(b => b.cho.forEach(c => { CHO[b.ten + '|' + c.id] = Object.assign({ bo_loc: b.ten }, c); }));
  const norm = s => s.trim().toLowerCase();
  const thuong = s => s.charAt(0).toLowerCase() + s.slice(1);   // "Trong khung AMD ▾" -> "trong khung AMD ▾"
  // Xếp: chữ A -> Z (bảng chữ cái tiếng Việt, không phân biệt hoa thường), số theo giá trị tăng dần, TB = 1000 GB,
  // số đứng trước chữ. Giống az_key trong ap-luat-quy-trinh-bo-loc.py.
  const VN = 'aăâbcdđeêghiklmnoôơpqrstuưvxy';
  const kyTu = ch => {
    if (/^\d/.test(ch)) return [1, parseFloat(ch.replace(',', '.')) * (/TB/.test(ch) ? 1000 : 1), 0];
    const lo = ch.toLowerCase();
    if (lo === ch.toUpperCase()) return [0, ch.codePointAt(0), 0];   // không phải chữ: dấu cách, gạch
    const d = lo.normalize('NFD'); let b = d[0]; const m = d.slice(1);
    if (lo === 'đ') b = 'đ';
    if (m.includes('̆') && b === 'a') b = 'ă';
    if (m.includes('̂')) b = { a: 'â', e: 'ê', o: 'ô' }[b] || b;
    if (m.includes('̛')) b = { o: 'ơ', u: 'ư' }[b] || b;
    const tone = [...'̣̀̉̃́'].findIndex(t => m.includes(t)) + 1;
    const i = VN.indexOf(b);
    return [2, i < 0 ? 99 : i, tone];
  };
  const azCmp = (a, b) => {
    const cat = s => s.normalize('NFC').match(/\d+(?:[.,]\d+)?(?:\s*TB)?|\D/gu) || [];
    const x = cat(a).map(kyTu), y = cat(b).map(kyTu);
    for (let i = 0; i < Math.min(x.length, y.length); i++)
      for (let j = 0; j < 3; j++) if (x[i][j] !== y[i][j]) return x[i][j] - y[i][j];
    return x.length - y.length;
  };
  // Owner chốt 13/11: bộ lọc có số đo xếp theo giá trị thật ("Dưới 90 Hz" trước 180 Hz, Full HD < 2K - 3K < 4K),
  // mọi "… khác" đứng cuối; bộ lọc không có số đo A -> Z. Giống xep_key trong ap-luat-quy-trinh-bo-loc.py.
  const SO_DO = new Set(['Tần số quét', 'Kích thước màn hình', 'Độ phân giải', 'RAM', 'Ổ cứng', 'Khoảng giá']);
  const DPG = { 'hd': 720, 'full hd': 1080, '2k - 3k': 1440, '2k': 1440, '4k': 2160 };
  const giaTriDo = ten => {
    const t = ten.normalize('NFC').trim().toLowerCase();
    if (t in DPG) return DPG[t];
    const m = t.match(/(\d+(?:[.,]\d+)?)\s*(tb)?/);
    if (!m) return null;
    let v = parseFloat(m[1].replace(',', '.')) * (m[2] ? 1000 : 1);
    if (t.startsWith('dưới')) v -= 0.5; else if (t.startsWith('trên')) v += 0.5;
    return v;
  };
  const laKhac = ten => { const t = ten.normalize('NFC').trim().toLowerCase(); return t === 'khác' || t.endsWith(' khác'); };
  const xepCmp = (a, b, boLoc) => {
    const ka = laKhac(a) ? 1 : 0, kb = laKhac(b) ? 1 : 0;
    if (ka !== kb) return ka - kb;
    const va = SO_DO.has(boLoc) ? giaTriDo(a) : null, vb = SO_DO.has(boLoc) ? giaTriDo(b) : null;
    if ((va === null) !== (vb === null)) return va === null ? 1 : -1;
    if (va !== null && va !== vb) return va - vb;
    return azCmp(a, b);
  };
  const xepAZ = (xs, boLoc) => [...xs].sort((a, b) => xepCmp(a.ten, b.ten, boLoc));

  function b21(items, moc) {                          // {tên: {k: 'hien' | 'khac', ly}}
    const out = {}, n = items.length, du = items.filter(x => x.sp >= Q.sp_min);
    items.filter(x => x.sp < Q.sp_min).forEach(x => { out[x.ten] = { k: 'khac', ly: `Chỉ ${x.sp} máy (dưới ${Q.sp_min})` }; });
    if (n <= Q.max_het) {
      du.forEach(x => { out[x.ten] = { k: 'hien', ly: `Chỗ này có ${n} giá trị (từ ${Q.max_het} trở xuống) nên hiện hết` }; });
    } else {
      const dat = du.filter(x => x.lt >= moc);
      if (dat.length >= Q.top_n) {
        du.forEach(x => { out[x.ten] = x.lt >= moc ? { k: 'hien', ly: `Đạt mốc chung ${so(moc)} lượt` } : { k: 'khac', ly: `Chưa đạt mốc chung ${so(moc)} lượt` }; });
      } else {
        const top = [...du].sort((a, b) => b.lt - a.lt).slice(0, Q.top_n);
        du.forEach(x => {
          out[x.ten] = top.includes(x)
            ? { k: 'hien', ly: (x.lt >= moc ? `Đạt mốc chung ${so(moc)} lượt` : `Chưa đạt mốc chung ${so(moc)} lượt`) +
                `, nằm trong ${Q.top_n} giá trị nhiều lượt tìm nhất (chỉ ${dat.length} giá trị đạt mốc)` }
            : { k: 'khac', ly: `Chưa đạt mốc chung ${so(moc)} lượt, không nằm trong ${Q.top_n} giá trị nhiều lượt tìm nhất` };
        });
      }
    }
    const khac = items.filter(x => out[x.ten].k === 'khac');
    if (khac.length === 1) { const o = out[khac[0].ten]; o.k = 'hien'; o.ly += ', nhưng chỉ 1 giá trị phải vào Khác nên hiện luôn'; }
    return out;
  }

  function tinh(f) {
    const moi = f.bo_loc === '__moi__', key = f.bo_loc + '|' + f.cho;
    const cu = moi ? null : (CHO[key].items.find(x => !x.cum && norm(x.ten) === norm(f.ten)) || null);
    const tong = Q.tong - (cu ? cu.lt : 0) + f.lt, soGt = Q.so_gt + (cu ? 0 : 1);
    const tho = tong / soGt / Q.he_so, moc = tho >= 100 ? Math.floor(tho / 100) * 100 : Math.floor(tho / 10) * 10;   // làm tròn xuống như C21
    const r = { buoc: [`Mốc chung = ${so(tong)} lượt ÷ ${so(soGt)} giá trị ÷ ${Q.he_so} = ${so(Math.round(tho))}, làm tròn ${so(moc)} lượt` +
      (cu ? ` (thay số đang có của ${cu.ten}: ${so(cu.lt)} lượt, ${cu.sp} máy)` : ' (đã cộng giá trị vừa gõ)')], anh: [] };
    const truoc = {}, sau = {};
    for (const k in CHO) {
      truoc[k] = b21(CHO[k].items, Q.moc);
      const items = k === key ? CHO[k].items.filter(x => x !== cu).concat([{ ten: f.ten, lt: f.lt, sp: f.sp, moi: 1 }]) : CHO[k].items;
      sau[k] = { items, kq: b21(items, moc) };
    }
    if (moi) {
      const ok = f.lt >= Q.moc_tt && f.sp >= Q.sp_min;
      r.buoc.push(`Thuộc tính mới cần từ ${so(Q.moc_tt)} lượt tìm và từ ${Q.sp_min} máy: ${ok ? 'đủ, được tạo' : 'chưa đủ, chưa tạo'}`);
      if (ok) r.buoc.push(`Thuộc tính chỉ có 1 giá trị (từ ${Q.max_het} trở xuống) nên giá trị hiện luôn`);
      r.ket = ok ? { c: `Tạo thuộc tính mới, hiện ${f.ten}`, them: 1 } : { c: 'Chưa tạo thuộc tính mới', them: 0 };
      r.dau = 'Màn hình đầu ';
    } else {
      const c = CHO[key], s = sau[key], o = s.kq[f.ten], n = s.items.length;
      const dat = s.items.filter(x => x.sp >= Q.sp_min && x.lt >= moc).length;
      r.buoc.push(`Số máy: ${f.sp} máy, ${f.sp >= Q.sp_min ? 'đủ' : 'dưới'} ${Q.sp_min} máy`);
      r.buoc.push(n <= Q.max_het
        ? `${c.ten} có ${n} giá trị (từ ${Q.max_het} trở xuống): hiện hết giá trị từ ${Q.sp_min} máy`
        : `${c.ten} có ${n} giá trị (trên ${Q.max_het}): ${dat} giá trị đạt mốc ${so(moc)} lượt` +
          (dat < Q.top_n ? `, chưa đủ ${Q.top_n} nên lấy ${Q.top_n} giá trị nhiều lượt tìm nhất` : ''));
      r.buoc.push(`${f.ten}: ${o.ly}`);
      r.ket = o.k === 'hien' ? { c: c.id === 'dau' ? 'Hiện riêng ở màn hình đầu' : `Hiện riêng ${thuong(c.ten)}`, them: 1 } : { c: `Vào ${c.ten_khac}`, them: 0 };
      if (o.k !== 'hien') r.buoc.push('Ngành hàng vẫn muốn hiện: SEO xác nhận lại. Vẫn muốn thì hiện thử 1 tháng, dưới 300 lượt truy cập thì bỏ hoặc gộp');
      r.dau = c.id === 'dau' ? 'Màn hình đầu ' : 'Trong khung ';
      r.cho = { ten: c.ten, ten_khac: c.ten_khac, hien: xepAZ(s.items.filter(x => s.kq[x.ten].k === 'hien'), c.bo_loc), khac: xepAZ(s.items.filter(x => s.kq[x.ten].k === 'khac'), c.bo_loc) };
    }
    for (const k in CHO) for (const x of CHO[k].items) {          // giá trị khác đổi kết quả (bị chen khỏi 3 giá trị cao nhất, mốc chung đổi...)
      if (x === cu) continue;
      const a = truoc[k][x.ten], b = sau[k].kq[x.ten];
      if (a && b && a.k !== b.k) {
        const noi = `${thuong(CHO[k].ten)} bộ lọc ${CHO[k].bo_loc}`;
        r.anh.push(`${x.ten} (${noi}): ${a.k === 'hien' ? 'đang hiện riêng' : 'đang ở ' + CHO[k].ten_khac}, nay ${b.k === 'hien' ? 'hiện riêng' : 'vào ' + CHO[k].ten_khac}`);
      }
    }
    return r;
  }

  const F = $('#qt-form'), el = id => document.getElementById(id);
  F.innerHTML = `<label>Tên giá trị<input id="qt-ten" type="text" value="Giá trị mới"></label>
    <label>Thuộc tính<select id="qt-bl">${Q.bo_loc.map(b => `<option>${esc(b.ten)}</option>`).join('')}<option value="__moi__">Thuộc tính mới</option></select></label>
    <label>Nằm ở<select id="qt-cho"></select></label>
    <label>Lượt tìm/tháng<input id="qt-lt" type="number" min="0" step="10" value="500"></label>
    <label>Số máy<input id="qt-sp" type="number" min="0" step="1" value="5"></label>`;
  function veCho() {
    const b = Q.bo_loc.find(x => x.ten === el('qt-bl').value);
    el('qt-cho').innerHTML = b ? b.cho.map(c => `<option value="${esc(c.id)}">${esc(c.ten)}</option>`).join('') : '<option value="dau">Màn hình đầu</option>';
    el('qt-cho').disabled = !b;
  }
  const doc = () => ({ ten: el('qt-ten').value.trim() || 'Giá trị mới', bo_loc: el('qt-bl').value, cho: el('qt-cho').value,
    lt: Math.max(0, Math.round(+el('qt-lt').value || 0)), sp: Math.max(0, Math.round(+el('qt-sp').value || 0)) });
  const chip = x => `<span class="qt-chip${x.moi ? ' moi' : ''}">${esc(x.ten)}<small>${so(x.lt)} lượt, ${x.sp} máy</small></span>`;
  function ve() {
    const f = doc(), r = tinh(f), rg = $('#luot');
    rg.max = Math.max(5000, f.lt); rg.value = f.lt; $('#luot-so').textContent = so(f.lt);
    const kq = $('#luot-kq');
    kq.textContent = r.ket.them ? 'Được hiện riêng' : 'Không hiện riêng'; kq.className = 'kq ' + (r.ket.them ? 'du' : 'chua');
    $('#thu-kq').innerHTML = `<div class="card"><h4>Hiện tại</h4><div class="mt">Web đang chạy</div><div class="c">Có giá trị riêng</div>
      <div class="t">Order giá trị nào thì tạo giá trị đó</div><span class="tag them">Màn hình đầu thêm 1 giá trị</span></div>
      <div class="card"><h4>${esc(TEN_PA3)}</h4><div class="mt">Theo quy trình mới</div><div class="c">${esc(r.ket.c)}</div>
      <div class="t">${esc(f.ten)}: ${so(f.lt)} lượt tìm, ${f.sp} máy</div>
      <span class="tag${r.ket.them ? ' them' : ''}">${esc(r.dau + (r.ket.them ? 'thêm 1 giá trị' : 'không thêm giá trị'))}</span></div>`;
    let h = `<div><h4>Cách tính</h4><ol>${r.buoc.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`;
    if (r.cho) {
      h += `<div><h4>${esc(r.cho.ten)} sau khi thêm</h4><div class="qt-row"><b>Hiện riêng</b>${r.cho.hien.map(chip).join('')}</div>` +
        (r.cho.khac.length ? `<div class="qt-row khac"><b>${esc(r.cho.ten_khac)}</b>${r.cho.khac.map(chip).join('')}</div>` : '<div class="qt-row"><b>Không có nhóm Khác</b></div>') + '</div>';
    }
    h += `<div><h4>Giá trị khác bị ảnh hưởng</h4>` + (r.anh.length ? `<ul>${r.anh.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p>Không giá trị nào đổi kết quả.</p>') + '</div>';
    $('#qt-ct').innerHTML = h;
    const key = JSON.stringify(f);
    $$('#vds .vd-b').forEach(b => b.classList.toggle('on', JSON.stringify(CFG.thu_order[+b.dataset.i].qt_form) === key));
  }
  const vds = $('#vds'), moiVds = vds.cloneNode(false);        // thay nút ví dụ cũ (bỏ hết sự kiện cũ)
  vds.replaceWith(moiVds);
  moiVds.innerHTML = CFG.thu_order.filter(v => v.qt_form).map(v => `<button class="vd-b" data-i="${CFG.thu_order.indexOf(v)}">${esc(v.ten)}${v.luot ? `<small>${so(v.luot)} lượt</small>` : ''}</button>`).join('');
  moiVds.addEventListener('click', e => {
    const b = e.target.closest('.vd-b'); if (!b) return;
    const q = CFG.thu_order[+b.dataset.i].qt_form;
    el('qt-ten').value = q.ten; el('qt-bl').value = q.bo_loc; veCho(); el('qt-cho').value = q.cho; el('qt-lt').value = q.lt; el('qt-sp').value = q.sp;
    ve();
  });
  const rg = $('#luot'), moiRg = rg.cloneNode(true);
  rg.replaceWith(moiRg);
  moiRg.addEventListener('input', e => { el('qt-lt').value = e.target.value; ve(); });
  el('qt-bl').addEventListener('change', () => { veCho(); ve(); });
  ['qt-cho', 'qt-ten', 'qt-lt', 'qt-sp'].forEach(id => el(id).addEventListener('input', ve));
  el('qt-cho').addEventListener('change', ve);
  veCho();
  ve();
}

  /* ---------- CSS riêng của 3 phần này ---------- */

  const hang = (x, ben) => node(x) + (ben ? `<div class="fc-h"><span>${ben.lb}</span></div>${node(ben)}` : '<div class="fc-gap"></div><div class="fc-gap"></div>');
  const fc = [
    hang({ b: 'Bước 1', ai: ['seo'], t: 'Gửi bộ Filter đề xuất cho Khai báo và Ngành hàng', s: 'Chọn theo nhu cầu tìm kiếm và sử dụng của khách. Lượt tìm lấy từ Ahrefs, Google Trends' }), doc(),
    hang({ b: 'Bước 2', ai: ['kb', 'nh'], t: 'Khai báo bộ Filter. Ngành hàng xem lại', s: 'Ngành hàng muốn thêm giá trị nào thì gửi bổ sung' }), doc(),
    hang({ b: 'Bước 3', c: 'd', t: 'Ngành hàng muốn bổ sung?' }, { lb: 'Không', c: 'end', t: 'Giữ nguyên, không làm thêm' }), doc('Có'),
    hang({ b: 'Bước 4', ai: ['seo'], t: 'Research giá trị muốn thêm', s: 'Lượt tìm/tháng và số máy đang bán',
      nut: '<button class="lk" id="b-qtr-thu">Thử order giá trị này</button>' }), doc(),
    hang({ c: 'd', t: 'Đủ điều kiện hiện theo 5 luật?', s: `Mốc chung ${so(Q.moc)} lượt, từ ${Q.sp_min} máy` }, { lb: 'Có', c: 'ok', ai: ['kb'], t: 'Khai báo bổ sung' }), doc('Không'),
    hang({ ai: ['seo', 'nh'], t: 'SEO xác nhận lại nhu cầu với Ngành hàng' }), doc(),
    hang({ c: 'd', t: 'Ngành hàng vẫn muốn hiện?' }, { lb: 'Không', c: 'end', t: 'Không hiện, không làm thêm' }), doc('Có'),
    hang({ ai: ['kb'], t: 'Khai báo bổ sung, hiện thử', s: 'Giá trị hiện theo mong muốn kinh doanh, chưa đủ điều kiện của SEO' }), doc(),
    hang({ b: 'Bước 5', c: 'd', t: 'Sau 1 tháng có từ 300 lượt truy cập?' }, { lb: 'Có', c: 'ok', t: 'Tiếp tục giữ' }), doc('Không'),
    hang({ c: 'bad', t: 'Bỏ hoặc gộp giá trị' }),
    `<div class="fc-dk">${node({ b: 'Bước 6, định kỳ', ai: ['seo'], t: '3 tháng/lần làm mới cả bộ Filter', s: 'Chạy lại từ Bước 1 với lượt tìm và số máy mới nhất' })}</div>`,
  ].join('');
  document.body.insertAdjacentHTML('beforeend', `<div class="drawer" id="d-qtr" aria-hidden="true">
    <div class="dh"><h3>Quy trình order bộ lọc giữa SEO, Khai báo và Ngành hàng</h3><span class="sp"></span><button class="btn b-dong-qtr">Đóng</button></div>
    <div class="fc-lg"></div>
    <div class="fc">${fc}</div></div>`);
  $('.fc-lg').innerHTML = `<span>Ai làm:</span>${ai(['seo', 'kb', 'nh'])}<span class="sp"></span><span>Ô vàng có dấu ? là chỗ hỏi Có / Không</span>`;
  const dQtr = $('#d-qtr'), bQtr = $('#b-qtr'), goc = setDrawer;
  setDrawer = (d, o) => {                                // mỗi lúc chỉ mở 1 bảng kéo lên, kể cả bảng quy trình
    const mo = d === dQtr && o;
    goc(mo || d === dQtr ? null : d, mo || d === dQtr ? false : o);
    dQtr.classList.toggle('open', mo); dQtr.setAttribute('aria-hidden', String(!mo)); bQtr.classList.toggle('on', mo);
  };
  bQtr.onclick = () => setDrawer(dQtr, !dQtr.classList.contains('open'));
  $('.b-dong-qtr').onclick = () => setDrawer(null, false);
  $('#b-qtr-thu').onclick = () => setDrawer(dThu, true);
  requestAnimationFrame(layout);
}

if (CFG.qt) { initQT(); initLuatQT(); } else veThu();
layout();
</script>
